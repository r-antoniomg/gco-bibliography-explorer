<h1 id="tag-title">Loading tag...</h1>

<div id="tag-records">
  Loading records...
</div>

<script>
const params = new URLSearchParams(window.location.search);
const tagName = params.get('name');

{% include bibliography-record-renderer.html %}

async function fetchAllTopItems() {
  const limit = 100;
  let start = 0;
  let allItems = [];

  while (true) {
    const url = `https://api.zotero.org/groups/6606998/items/top?format=json&limit=${limit}&start=${start}`;
    const response = await fetch(url);
    const items = await response.json();

    allItems = allItems.concat(items);

    if (items.length < limit) {
      break;
    }

    start += limit;
  }

  return allItems;
}

if (!tagName) {
  document.getElementById('tag-title').textContent = 'No tag specified';
  document.getElementById('tag-records').innerHTML = '<p>Please provide a tag name in the URL.</p>';
} else {
  const normalizedTagName = normalizeTag(tagName);

  document.getElementById('tag-title').textContent = `Tag: ${normalizedTagName}`;

  fetchAllTopItems()
    .then(items => {
      const matchingItems = items.filter(item => {
        const tags = item.data.tags || [];

        return tags.some(t => normalizeTag(t.tag) === normalizedTagName);
      });

      let html = `
        <p>
          Showing records across the bibliography tagged
          <strong>${normalizedTagName}</strong>.
        </p>

        <p><strong>Records:</strong> ${matchingItems.length}</p>
      `;

      if (matchingItems.length === 0) {
        html += '<p>No records found for this tag.</p>';
      }

      matchingItems.forEach(item => {
        html += renderBibliographyRecord(item);
      });

      document.getElementById('tag-records').innerHTML = html;
    })
    .catch(error => {
      document.getElementById('tag-title').textContent = 'Error';
      document.getElementById('tag-records').innerHTML = '<p>Error loading tag data.</p>';
      console.error(error);
    });
}
</script>
