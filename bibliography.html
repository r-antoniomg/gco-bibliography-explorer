<h1>Bibliography</h1>

<div id="bibliography">
  Loading bibliography...
</div>

<script>
fetch('https://api.zotero.org/groups/6606998/items/top?format=json&limit=100')
  .then(response => response.json())
  .then(data => {

    let html = '';

    data.forEach(item => {

      const record = item.data;

      const title = record.title || 'Untitled';
      const itemType = record.itemType || '';
      const date = record.date || '';
      const abstract = record.abstractNote || '';

      let authors = '';

      if (record.creators) {
        authors = record.creators
          .map(c => {
            if (c.name) {
              return c.name;
            }
            return [c.firstName, c.lastName]
              .filter(Boolean)
              .join(' ');
          })
          .join('; ');
      }

      let tags = '';

      if (record.tags) {
        tags = record.tags
          .map(t => t.tag)
          .join('; ');
      }

      html += `
        <article class="bib-record">

          <h2>${title}</h2>

          <p>
            <strong>Authors:</strong>
            ${authors || 'None'}
          </p>

          <p>
            <strong>Date:</strong>
            ${date}
          </p>

          <p>
            <strong>Tags:</strong>
            ${tags || 'None'}
          </p>

          <p>
            <strong>Abstract:</strong>
            ${abstract || 'No abstract'}
          </p>

          <hr>

        </article>
      `;

    });

    document.getElementById('bibliography').innerHTML = html;

  })
  .catch(error => {

    document.getElementById('bibliography').innerHTML =
      'Error loading bibliography data';

    console.error(error);

  });
</script>
