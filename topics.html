<h1>Explore the Bibliography by Topic</h1>

<p>
Browse records across all collections using topic tags derived from the Zotero library.
Tag size reflects the number of records associated with the topic.
</p>

<div id="topic-cloud">
  Loading topics...
</div>

<style>
.topic-cloud {
  line-height: 2.5;
}

.topic-cloud button {
  margin: 0.25rem;
  border: 1px solid #cccccc;
  border-radius: 999px;
  background: #f5f5f5;
  cursor: pointer;
}
</style>

<script>
  const BASE_URL = '{{ site.baseurl }}';

fetch('https://api.zotero.org/groups/6606998/items/top?format=json&limit=100')
  .then(response => response.json())
  .then(items => {

    const tagCounts = {};

    items.forEach(item => {
      (item.data.tags || []).forEach(tag => {
        tagCounts[tag.tag] = (tagCounts[tag.tag] || 0) + 1;
      });
    });

    const sortedTags = Object.entries(tagCounts)
      .sort((a, b) => b[1] - a[1]);

    if (sortedTags.length === 0) {
      document.getElementById('topic-cloud').innerHTML =
        '<p>No tags found in the bibliography.</p>';
      return;
    }

    const maxCount = sortedTags[0][1];

    let html = '<div class="topic-cloud">';

    sortedTags.forEach(([tag, count]) => {

      const size = 0.9 + ((count / maxCount) * 1.2);
      const encodedTag = encodeURIComponent(tag);

      html += `
        <button
          type="button"
          style="font-size:${size}rem"
          onclick="window.location.href='${BASE_URL}/tag/?name=${encodedTag}'">
          ${tag} (${count})
        </button>
      `;
    });

    html += '</div>';

    document.getElementById('topic-cloud').innerHTML = html;
  })
  .catch(error => {
    document.getElementById('topic-cloud').innerHTML =
      '<p>Error loading topics.</p>';
    console.error(error);
  });
</script>
