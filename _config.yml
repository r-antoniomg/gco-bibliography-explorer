# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: German Canadiana in Ontario (GCO) Bibliography
description: >- # this means to ignore newlines until "baseurl:"
  The German Canadiana Bibliography in Ontario (GCO) was started in 2007 and is a project of the University of Waterloo Libraries. It is updated continuously, as new information becomes available.
baseurl: "/gco-bibliography-explorer" # the subpath of your site, e.g. /blog
url: "https://r-antoniomg.github.io" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb
github_username:  r-antoniomg

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Header pages
header_pages:
  - about.md
  - release-notes.md

# Zotero library : Enter the Zotero library key that you want to use.

zotero:
  group_id: 6606998

# Record fields for public display

record_display:
  show_zotero_key: true # The Zotero key can be used to link a record from the bibliography to blog posts, essays,
                        # or other scholarly outputs that you write within your bibliography site. You can set this value
                        # to 'false' if you don't want the zotero_key to display to the public.
  display_fields:
    - title
    - creators

    # Publication/source
    - publicationTitle
    - bookTitle
    - volume
    - issue
    # - pages ## The pages were excluded from the GCO test because of identified issues in metadata quality, you may uncomment this field
    # for your own project if your metadata quality is more consistent.

    # Publication details
    - place
    - publisher
    - date
    - language

    # Access/identifiers
    - url
    - doi
    - isbn
    - issn
    - zoteroKey

    # Topics
    - tags

    # Description
    - abstract

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
